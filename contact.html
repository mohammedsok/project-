<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact form</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="main-nav">
        <a href="index.html">Home</a> |
        <a href="about.html">About</a> |
        <a href="contact.html">Contact</a> |
        <a href="validation.html">Registration</a> |
        <a href="data.html">Data Table</a>
    </nav>
    <form>
        <div>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>
        </div>           
        <div>
            <label for="email"> Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="number">Age</label>
            <input type="number" id="number" name="number" required>
        </div>
        <div>
            <label for="birthday">Your birthday</label>
            <input type="date" id="birthday" name="birthday" required>
        </div>
     <div class="on">
    <h3 class="mm">Are you a student</h3>
    </div>
        <div>
            <div>
                <input type="radio" id="yes" name="Student_or_no" value="yes">
                <label for="yes">Yes</label>
            </div>
            <div>
                <input type="radio" id="no" name="Student_or_no" value="no">
                <label for="no">No</label>
            </div>
        </div>
        <h3 class="mm">Topics of Interest</h3>
        <div>
            <div class="in" >
                <input type="checkbox" id="web" name="Interests" value="web">
                <label for="web">Web Development</label>
            </div>
            <div class="in">
                <input type="checkbox" id="AI" name="Interests" value="AI">
                <label for="AI">AI</label>
            </div>
            <div class="in">
                <input type="checkbox" id="Cyber" name="Interests" value="Cyber">
                <label for="Cyber">Cybersecurity</label>
            </div>
        </div>
        <h3 class="mm">Contact Reason</h3>
        <div>   
                <select class="option" name="Academic Year" id="Academic_Year">
                
                <option class="option" value="" disabled selected hidden >Select Reason</option>
                <option class="option" value="General">General Inquiry</option>
                <option class="option" value="Technical" >Technical Support</option>
                <option class="option" value="Feedback">Feedback </option>
                
            </select>    
        </div>
    <h3 class="mm">Any Message</h3>    
        <div>
            <textarea name="Message" id="Message"></textarea>
        </div>
        <div>
                <input type="submit">
        </div>
    </form>

    <a href="index.html">back</a>
</body>
</html>
